<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Study · 의학 심화 학습</title>
<meta name="description" content="신장내과 + 인접 과목 — 매일 18:00 KST, 3일 사이클로 자동 작성되는 학습 브리핑">
<meta name="theme-color" content="#132d46">
<link rel="manifest" href="manifest.json?v=14">
<link rel="icon" href="icon.svg?v=14" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=14">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=14">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=14">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study">
<meta name="application-name" content="Study">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
<link rel="stylesheet" href="assets/content-visuals.css?v=15">
<style>
:root{--bg:#f3f6f7;--panel:#fff;--panel-2:#f4f7f8;--line:#dce5e8;--ink:#172f43;--ink-2:#425b6c;--ink-3:#657b88;--navy:#132d46;--teal:#138a83;--teal-dark:#076e68;--teal-soft:#e6f5f2;--amber:#885b17;--rose:#a44348;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;--sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button,summary,a{-webkit-tap-highlight-color:transparent}
a{color:var(--teal-dark);text-underline-offset:3px}
button,summary{cursor:pointer}
button{touch-action:manipulation}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e9b75b;outline-offset:4px}
button:disabled{cursor:default}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
[hidden]{display:none!important}
.skip-link{position:fixed;top:-80px;left:16px;z-index:100;background:white;padding:12px 20px;border-radius:8px}
.skip-link:focus{top:12px}
.wrap{max-width:1100px;margin:0 auto;padding:0 32px 36px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0 20px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);text-decoration:none;font-size:22px;letter-spacing:-.8px;font-weight:800}
.brand img{width:38px;height:38px;border-radius:11px}
.brand small{font-size:12px;letter-spacing:.1em;font-weight:600;color:var(--ink-3);margin-left:5px}
.top-r{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.status-dot{height:6px;width:6px;border-radius:50%;background:var(--teal)}
.header{background:var(--navy);border-radius:24px;padding:34px 38px;position:relative;overflow:hidden;color:white;display:flex;justify-content:space-between;gap:28px;align-items:center}
.h-eyebrow{font-size:11px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:#8ed9d0;margin-bottom:12px}
.h-title{font-size:32px;line-height:1.35;font-weight:750;letter-spacing:-1.2px;margin:0 0 11px}
.h-description{font-size:14px;color:#c1d1dd;margin:0;max-width:490px}
.h-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px;font-size:12px;color:#c1d1dd}
.h-meta b{font-weight:550;color:white;letter-spacing:.03em}
.pill{background:#29465d;color:#c9ece6;border:1px solid #3f6274;border-radius:6px;padding:2px 8px;font-size:11px}
.hero-art{width:150px;height:140px;flex-shrink:0;opacity:.94}
.hero-art img{width:116px;height:116px;display:block;margin:12px auto;border-radius:29px;box-shadow:0 12px 30px #05172744}
.date-bar{margin:18px 0 26px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.reading-note{font-size:12px;color:var(--ink-3);padding-top:10px;margin:0}
.archive{position:relative;min-width:255px}
.archive>summary{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink-2)}
.archive>summary .chevron{font-size:17px;line-height:1}
.archive[open]>summary .chevron{transform:rotate(180deg)}
.calendar{position:absolute;top:54px;right:0;width:342px;z-index:20;background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 40px #132d4620}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-title{font-size:16px;font-weight:700}
.cal-nav{display:flex;gap:4px}
.cal-btn{min-width:44px;height:44px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:white;font-size:22px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0}
.cal-wd{text-align:center;font-size:11px;color:var(--ink-3);padding:6px}
.cal-day{border:0;background:transparent;height:44px;min-width:0;font-family:var(--mono);font-size:13px;border-radius:9px;position:relative;color:var(--ink-3)}
.cal-day:disabled{color:#9aabb6}
.cal-day.has:after{content:'';position:absolute;width:4px;height:4px;border-radius:4px;background:var(--teal);bottom:4px;left:calc(50% - 2px)}
.cal-day.has:hover{background:var(--teal-soft)}
.cal-day.today{box-shadow:inset 0 0 0 1px var(--teal)}
.cal-day.is-selected{color:white;background:var(--navy)}
.cal-day.is-selected:after{background:#88dbd0}
.cal-count{font-size:11px;color:var(--ink-3);margin:10px 0 0}
.section-kicker{font-size:11px;letter-spacing:.13em;font-weight:700;color:var(--teal-dark);text-transform:uppercase}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
.section-heading h2{margin:3px 0 0;font-size:23px;letter-spacing:-.7px;line-height:1.4}
.section-heading p{font-size:12px;color:var(--ink-3);margin:0}
.overview{margin-bottom:30px}
.overview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.overview-card{display:flex;flex-direction:column;padding:20px 21px;background:white;border:1px solid var(--line);border-radius:15px;text-decoration:none;color:var(--ink);box-shadow:0 3px 7px #132d4603;min-height:174px;transition:transform .15s,border-color .15s}
.overview-card:hover{transform:translateY(-2px);border-color:#83bdb9}
.overview-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-3);margin-bottom:14px}
.overview-card strong{font-size:15px;font-weight:650;line-height:1.65;letter-spacing:-.25px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.overview-bottom{display:flex;justify-content:space-between;font-size:11px;color:var(--teal-dark);padding-top:16px;margin-top:auto}
.overview-empty{padding:22px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink-2)}
.specialty-nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;position:sticky;top:0;z-index:10;background:#f3f6f7f5;backdrop-filter:blur(10px);padding:14px 0 17px;margin:0 0 20px;border-bottom:1px solid var(--line)}
.specialty-nav a{display:flex;gap:8px;align-items:center;flex-shrink:0;text-decoration:none;color:var(--ink-2);padding:10px 14px;min-height:44px;border-radius:9px;border:1px solid var(--line);background:white;font-size:13px;font-weight:600}
.specialty-nav a:hover,.specialty-nav a:focus{background:var(--navy);color:white;border-color:var(--navy)}
.specialty-nav .nav-count{font-size:10px;opacity:.75}
.specialty-section{margin:0 0 32px;scroll-margin-top:86px}
.sp-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sp-num{display:grid;place-items:center;background:#e4eeee;border:1px solid #d3e5e3;border-radius:10px;width:42px;height:42px;font-size:12px;font-family:var(--mono);color:var(--teal-dark)}
.sp-title{font-size:20px;font-weight:700;letter-spacing:-.5px;margin:0;line-height:1.35}
.sp-title small{display:block;font-size:11px;color:var(--ink-3);font-weight:400;letter-spacing:.015em;margin-top:3px}
.sp-sub{margin-left:auto;font-size:12px;color:var(--ink-3)}
.article-list{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}
.item{border-bottom:1px solid var(--line);scroll-margin-top:92px}
.item:last-child{border-bottom:0}
.item-head{display:grid;grid-template-columns:82px minmax(0,1fr) 24px;gap:15px;align-items:start;padding:20px 22px;min-height:76px}
.item-head:hover{background:#fafcfc}
.item-cat{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:650;white-space:nowrap;margin-top:2px;color:#315779;background:#edf3f8}
.item-cat.guide{color:#826121;background:#faf3e3}
.item-cat.ins{color:#705388;background:#f3edf8}
.item-cat.drug{color:#087b6e;background:#e8f6f1}
.item-cat.int{color:#9a5143;background:#fcf0e9}
.item-cat.safe{color:#a43d4c;background:#fbedf0}
.cat-symbol{font-size:12px;line-height:1}
.item-headline{font-size:16px;font-weight:650;line-height:1.65;letter-spacing:-.27px;margin:0}
.item-summary{font-size:14px;color:var(--ink-3);line-height:1.65;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-toggle{display:grid;place-items:center;height:28px;color:var(--ink-3);font-size:20px;font-weight:300;transition:transform .15s}
.item[open]>.item-head .item-toggle{transform:rotate(45deg);color:var(--teal)}
.item[open]>.item-head{background:#f8fbfb}
.blocks{padding:0 22px 22px 119px}
.block{padding:18px 0;border-bottom:1px solid #e9eef0;font-size:16px;min-width:0}
.block:last-child{border-bottom:0;padding-bottom:0}
.block h4{font-size:12px;letter-spacing:.025em;color:var(--teal-dark);margin:0 0 8px;font-weight:700}
.block p,.block ul,.block ol{margin:0 0 9px;font-size:16px;line-height:1.85;color:var(--ink-2)}
.block p:last-child,.block ul:last-child,.block ol:last-child{margin-bottom:0}
.block ul,.block ol{padding-left:23px}
.block li{margin-bottom:5px}
.block strong{color:var(--ink);font-weight:650}
.block.algo{border-left:3px solid var(--teal);padding:16px 18px;margin:12px 0;background:#f0f8f6;border-radius:0 9px 9px 0}
.block.cautions{border-left:3px solid #c99354;background:#fcf7ef;padding:16px 18px;border-radius:0 9px 9px 0}
.block.source p,.block.source li{font-size:13px}
.block.source a{word-break:break-word}
.no-updates{border:1px dashed #cedde2;border-radius:11px;margin-top:12px;color:var(--ink-3);font-size:12px;background:#ffffff80}
.no-updates>summary{min-height:44px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.no-updates>summary span:first-child{display:flex;gap:8px;align-items:center}
.no-updates[open] .empty-caret{transform:rotate(180deg)}
.empty-items{padding:0 16px 12px;margin:0;list-style:none}
.empty-items li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #e6eded;font-size:12px}
.empty-items .item-cat{min-width:78px}
.tag{display:inline-flex;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:650;margin-right:7px;color:var(--teal-dark);background:var(--teal-soft)}
.tag.now{background:#fbedf0;color:var(--rose)}
.tag.recur{background:#faf3e3;color:var(--amber)}
.learning-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:40px}
.review-section{scroll-margin-top:92px}
.quiz{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:12px}
.quiz-number{display:block;color:var(--teal-dark);font-size:11px;font-weight:700;letter-spacing:.1em;margin-bottom:8px}
.quiz-q{font-size:16px;font-weight:650;line-height:1.65;margin:0 0 16px}
.quiz-options{border:0;padding:0;margin:0 0 14px;min-width:0}
.quiz-option{display:flex;gap:10px;align-items:flex-start;font-size:14px;min-height:44px;line-height:1.6;padding:10px 12px;background:#f5f8f9;border:1px solid transparent;border-radius:8px;margin-bottom:6px;cursor:pointer}
.quiz-option:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.quiz-option input{accent-color:var(--teal);margin:4px 0 0;flex-shrink:0;width:16px;height:16px}
.quiz-prompt{font-size:15px;color:var(--ink-2)}
.quiz-toggle{display:flex;align-items:center;justify-content:space-between;min-height:44px;color:var(--teal-dark);font-size:13px;font-weight:650}
.quiz-toggle:after{content:'+';font-size:22px;font-weight:400}
.quiz-answer[open]>.quiz-toggle:after{content:'−'}
.quiz-a{font-size:15px;background:var(--teal-soft);border-radius:9px;padding:14px 16px;color:var(--ink-2)}
.quiz-a p{margin:0 0 7px}
.quiz-a p:last-child{margin-bottom:0}
.recall{background:var(--navy);border-radius:16px;color:white;padding:23px 24px}
.recall-label{font-size:18px;font-weight:650;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:44px}
.recall-label small{color:#9dd8d0;font-size:10px;font-weight:500}
.recall-sub{font-size:12px;color:#b5cbd6;margin:8px 0 16px}
.recall ul{list-style:none;padding:0;margin:0}
.recall li{font-size:15px;line-height:1.8;padding:13px 0 13px 20px;position:relative;border-top:1px solid #ffffff1a;color:#e0e9ef}
.recall li:before{content:'';width:5px;height:5px;background:#72c6bb;position:absolute;left:0;top:24px;border-radius:50%}
.recall a{color:#9ce0d6}
.case-section{background:white;border:1px solid var(--line);border-radius:15px;padding:24px;margin:30px 0}
.case-section h3{font-size:18px;margin:8px 0}
.case-section .block{border:0}
.state{padding:56px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.state-mark{font-size:24px;margin-bottom:10px;color:var(--teal)}
.state button{background:white;border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 16px;color:var(--teal-dark);margin-top:16px}
.footer{border-top:1px solid var(--line);margin-top:36px;padding-top:23px;font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.footer p{margin:0}
.footer .author{max-width:65%;text-align:right}
.md-table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.md-table{border-collapse:collapse;width:100%;font-size:14px;text-align:left;min-width:280px}
.md-table th,.md-table td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
.md-table th{background:#edf5f4;font-size:12px;color:var(--teal-dark);font-weight:700}
.md-table tr:last-child td{border-bottom:0}
.md-callout{background:#eef6fa;border-left:3px solid #4989ac;border-radius:0 9px 9px 0;padding:14px 16px;margin:12px 0}
.md-callout.warning,.md-callout.caution{background:#fcf5e9;border-color:#bf8b42}
.md-callout-title{font-size:12px;font-weight:700;margin-bottom:7px;color:var(--ink)}
.md-callout p{font-size:15px}
.flow{margin:16px 0;padding:18px;background:#edf6f4;border-radius:12px;border:1px solid #d2e8e2}
.flow figcaption{font-size:12px;font-weight:700;margin-bottom:13px;color:var(--teal-dark)}
.flow ol{list-style:none;padding:0;margin:0;display:flex;gap:22px;flex-wrap:wrap}
.flow li{flex:1;min-width:130px;position:relative;border:1px solid #c9deda;background:white;border-radius:8px;padding:13px;font-size:14px;line-height:1.65;margin:0}
.flow li:not(:last-child):after{content:'→';position:absolute;right:-18px;top:calc(50% - 13px);color:var(--teal)}
.flow-step{display:block;font:10px var(--mono);color:var(--teal-dark);margin-bottom:6px}
.md-code{font:13px/1.8 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:#f0f4f6;border-radius:8px}
code{font-family:var(--mono);font-size:.85em;background:#e8eef1;border-radius:3px;padding:1px 4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}


@media(max-width:760px){.wrap{padding:0 20px 28px}
.topbar{padding:17px 0}
.brand{font-size:21px}
.brand small{display:none}
.header{padding:27px 25px;border-radius:20px;gap:14px}
.h-title{font-size:27px}
.hero-art{width:84px;height:96px}
.hero-art img{width:84px;height:84px;margin:6px 0;border-radius:22px}
.h-description{font-size:13px}
.h-meta{margin-top:18px;font-size:11px}
.overview-grid{gap:10px}
.overview-card{padding:16px;min-height:172px}
.overview-card strong{font-size:14px}
.overview-top{font-size:10px}
.reading-note{max-width:210px}
.learning-grid{grid-template-columns:1fr;gap:24px;margin-top:32px}
.blocks{padding-left:22px}
.recall{padding:22px}
.footer{margin-top:28px}
}


@media(max-width:520px){.wrap{padding:0 16px 26px}
.top-r{font-size:10px}
.brand img{width:34px;height:34px}
.header{padding:24px;border-radius:18px;display:block}
.hero-art{position:absolute;right:-11px;top:22px;opacity:.22;transform:rotate(-13deg);width:114px;height:114px;pointer-events:none}
.hero-art img{width:114px;height:114px}
.h-title{font-size:27px;position:relative}
.h-description{max-width:265px;position:relative}
.h-eyebrow{font-size:10px}
.h-meta{gap:8px}
.date-bar{margin:14px 0 26px;display:block}
.reading-note{max-width:none;font-size:11px;padding:0;margin:0 0 11px}
.archive{min-width:0}
.archive>summary{font-size:12px}
.calendar{position:static;box-shadow:none;width:100%;margin-top:8px;padding:12px}
.section-heading{margin-bottom:14px}
.section-heading h2{font-size:21px}
.section-heading p{font-size:11px}
.overview-grid{grid-template-columns:1fr;gap:9px}
.overview-card{min-height:0;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:0 12px}
.overview-top{grid-column:1/3;margin:0 0 7px;font-size:10px}
.overview-card strong{font-size:14px;line-height:1.65;display:block;grid-column:1/2}
.overview-bottom{padding:0;font-size:19px;justify-content:end;align-items:center}
.overview-bottom span:first-child{display:none}
.overview{margin-bottom:19px}
.specialty-nav{margin-bottom:22px;padding:11px 0 12px;gap:7px}
.specialty-nav a{font-size:12px;padding:10px 12px}
.sp-title{font-size:19px}
.sp-num{width:36px;height:38px}
.sp-sub{font-size:11px}
.item-head{padding:18px 16px;grid-template-columns:minmax(0,1fr) 20px;gap:8px 10px}
.item-head>.item-cat{grid-column:1;width:max-content;margin:0}
.item-copy{grid-column:1}
.item-toggle{grid-column:2;grid-row:1/3;align-self:center}
.item-headline{font-size:16px}
.item-summary{font-size:13px}
.blocks{padding:0 16px 18px}
.block{padding:16px 0}
.block p,.block li{font-size:15.5px;line-height:1.85}
.block.algo,.block.cautions{padding:14px}
.no-updates>summary{font-size:11px;padding:11px 12px}
.empty-items{padding:0 12px 10px}
.empty-items li{gap:8px;font-size:11px}
.empty-items .item-cat{font-size:10px}
.quiz{padding:19px 17px}
.quiz-q{font-size:16px}
.quiz-option{font-size:14px}
.recall li{font-size:15px}
.footer{display:block;line-height:1.8}
.footer .author{max-width:none;text-align:left;margin-top:8px}
.flow ol{display:block}
.flow li{margin:0 0 24px}
.flow li:last-child{margin-bottom:0}
.flow li:not(:last-child):after{content:'↓';right:auto;left:calc(50% - 6px);top:auto;bottom:-25px}
.md-table{font-size:13px}
.md-table th,.md-table td{padding:9px 11px}
}


@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}
*,*:before,*:after{animation:none!important;transition:none!important}
}


@media print{body{background:white}
.wrap{max-width:none;padding:0}

<script>
/* ============================================================
 * Study PWA — 동적 마크다운 렌더 + GitHub 캘린더 + SW 등록
 * ============================================================ */

const REPO = 'bwkim1025/study';
const CAT  = 'briefings';   // briefings/YYYY-MM-DD-dayN.md
const SPECIALTIES = {
  NEPHROLOGY:    { title: 'Nephrology',       sub: '신장내과' },
  ENDOCRINOLOGY: { title: 'Endocrinology',    sub: '내분비 · 당뇨' },
  CARDIOLOGY:    { title: 'Cardiology',       sub: '심혈관' },
  INFECTIOUS:    { title: 'Infectious Disease', sub: '감염내과' },
  PULMONOLOGY:   { title: 'Pulmonology',      sub: '호흡기' },
  GASTROENTEROLOGY: { title: 'Gastroenterology', sub: '소화기 · 간' },
  FAMILY:        { title: 'Family Medicine',  sub: '가정의학' },
  RHEUMATOLOGY:  { title: 'Rheumatology',     sub: '류마티스' },
  PSYCHIATRY:    { title: 'Psychiatry',       sub: '정신과' },
  GERIATRICS:    { title: 'Geriatrics',       sub: '노년내과' },
};

/* ---------- helpers ---------- */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function kstNow(){return new Date(Date.now()+9*3600*1000);}
function kstDateStr(offsetDays){
  const d=kstNow();d.setUTCDate(d.getUTCDate()-(offsetDays||0));
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function formatDate(ds){
  if(!ds) return '—';
  const [y,m,d]=ds.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  const wd=['SUN','MON','TUE','WED','THU','FRI','SAT'][dt.getUTCDay()];
  return y+'.'+String(m).padStart(2,'0')+'.'+String(d).padStart(2,'0')+' · '+wd;
}

/* ---------- safe, source-authored Markdown ---------- */
function mdInline(input){
  const s=String(input||'');
  const pattern=/`([^`]+)`|\*\*([^*]+)\*\*|\[([^\]]+)\]\((https?:\/\/(?:[^\s()]|\([^\s()]*\))+)\)|\[(https?:\/\/[^\s\]]+)\]|https?:\/\/[^\s<>]+/g;
  let out='',cursor=0,m;
  while((m=pattern.exec(s))){
    out+=esc(s.slice(cursor,m.index));
    if(m[1]!==undefined) out+='<code>'+esc(m[1])+'</code>';
    else if(m[2]!==undefined) out+='<strong>'+mdInline(m[2])+'</strong>';
    else {const url=m[4]||m[5]||m[0],label=m[3]||url;out+='<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>';}
    cursor=pattern.lastIndex;
  }
  return out+esc(s.slice(cursor));
}
function tableCells(line){return line.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\\|/g,'|'));}
function isTableRule(line){return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line||'');}
function renderFlow(lines){
  const content=lines.filter(l=>l.trim());
  const title=/^title:\s*/i.test(content[0]||'')?content.shift().replace(/^title:\s*/i,''):'원문 기반 흐름';
  const steps=content.map(l=>l.replace(/^\s*(?:[-*]|\d+[.)])\s+/,''));
  if(!steps.length) return '';
  return '<figure class="flow"><figcaption>'+mdInline(title)+'</figcaption><ol>'+steps.map((s,i)=>'<li><span class="flow-step">'+String(i+1).padStart(2,'0')+'</span>'+mdInline(s)+'</li>').join('')+'</ol></figure>';
}
function mdBlock(text){
  if(!text) return '';
  const lines=String(text).split(/\r?\n/);const out=[];let listType=null,listBuf=[];
  const flush=()=>{if(listBuf.length){out.push('<'+listType+'>'+listBuf.map(li=>'<li>'+mdInline(li)+'</li>').join('')+'</'+listType+'>');listBuf=[];listType=null;}};
  for(let i=0;i<lines.length;i++){
    const ln=lines[i],fence=ln.match(/^\s*```([\w-]*)\s*$/);
    if(fence){
      flush();const body=[];
      while(i+1<lines.length&&!/^\s*```\s*$/.test(lines[i+1]))body.push(lines[++i]);
      const closed=i+1<lines.length;if(closed)i++;
      const raw=body.join('\n'),fallback='<pre class="md-code">'+esc(raw)+'</pre>';
      if(fence[1]==='visual'){
        let rendered=fallback;
        if(closed&&typeof window.ContentVisuals?.renderJSON==='function'){
          try{rendered=window.ContentVisuals.renderJSON(raw);}catch(_){/* Keep source readable if the visual engine fails. */}
        }
        out.push(rendered);
      }else out.push(['flow','diagram'].includes(fence[1])?renderFlow(body):fallback);
      continue;
    }
    const callout=ln.match(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/i);
    if(callout){flush();const body=[];while(i+1<lines.length&&/^>/.test(lines[i+1]))body.push(lines[++i].replace(/^>\s?/,''));const type=callout[1].toLowerCase(),labels={note:'참고',tip:'학습 포인트',important:'핵심',warning:'주의',caution:'주의'};out.push('<aside class="md-callout '+type+'"><div class="md-callout-title">'+mdInline(callout[2]||labels[type])+'</div>'+mdBlock(body.join('\n'))+'</aside>');continue;}
    if(ln.includes('|')&&isTableRule(lines[i+1])){
      flush();const headers=tableCells(ln),rules=tableCells(lines[++i]),rows=[];
      while(i+1<lines.length&&lines[i+1].trim()&&lines[i+1].includes('|'))rows.push(tableCells(lines[++i]));
      const align=col=>rules[col]?.startsWith(':')&&rules[col]?.endsWith(':')?'center':rules[col]?.endsWith(':')?'right':'left';
      out.push('<div class="md-table-wrap" role="region" aria-label="본문 표" tabindex="0"><table class="md-table"><thead><tr>'+headers.map((h,n)=>'<th scope="col" style="text-align:'+align(n)+'">'+mdInline(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+headers.map((h,n)=>'<td style="text-align:'+align(n)+'">'+mdInline(row[n]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;
    }
    const ol=ln.match(/^\s*\d+\.\s+(.+)/),ul=ln.match(/^\s*[-*]\s+(.+)/);
    if(ol){if(listType!=='ol'){flush();listType='ol';}listBuf.push(ol[1]);}
    else if(ul){if(listType!=='ul'){flush();listType='ul';}listBuf.push(ul[1]);}
    else if(!ln.trim())flush();else{flush();out.push('<p>'+mdInline(ln.replace(/^>\s?/,''))+'</p>');}
  }
  flush();return out.join('');
}

/* ---------- markdown parser tailored to our schema ---------- */
function parseMarkdown(md){
  const lines=md.split(/\r?\n/);
  const result={
    date:'', day:'', title:'',
    decisionPoints:[], specialties:Object.create(null), specialtyOrder:[],
    case_:null, selfCheck:[], recallCard:[],
    author:'',
  };
  let mode=null;     // DECISION_POINTS | SPECIALTY | CASE | SELF_CHECK | RECALL_CARD | AUTHOR
  let currentSp=null;
  let currentItem=null;
  let currentBlock=null;     // whyItMatters | abstract | keyResult | algorithm | compare | context | cautions | source
  let currentQuiz=null;
  let buffer=[];
  let inFence=false,visualFence=false;
  const flushBuffer=()=>{
    if(!buffer.length) return;
    const txt=buffer.join('\n').replace(/^\s+|\s+$/g,'');
    if(currentItem && currentBlock){
      currentItem[currentBlock]=(currentItem[currentBlock]?currentItem[currentBlock]+'\n':'')+txt;
    } else if(currentItem){
      currentItem.summary=(currentItem.summary?currentItem.summary+'\n':'')+txt;
    } else if(mode==='CASE' && result.case_){
      result.case_.body=(result.case_.body?result.case_.body+'\n':'')+txt;
    } else if(currentQuiz && currentBlock==='answer'){
      currentQuiz.answer=(currentQuiz.answer?currentQuiz.answer+'\n':'')+txt;
    } else if(currentQuiz && currentBlock==='q'){
      currentQuiz.prompt=(currentQuiz.prompt?currentQuiz.prompt+'\n':'')+txt;
    } else if(mode==='AUTHOR'){
      result.author=(result.author?result.author+' ':'')+txt;
    }
    buffer=[];
  };

  for(const raw of lines){
    const line=raw;
    if(visualFence){buffer.push(line);if(/^\s*```\s*$/.test(line)){inFence=false;visualFence=false;}continue;}
    if(!inFence&&/^\s*```visual\s*$/.test(line)){inFence=true;visualFence=true;buffer.push(line);continue;}
    if(/^\s*```/.test(line)){inFence=!inFence;buffer.push(line);continue;}
    if(inFence){buffer.push(line);continue;}
    // h1: # 2026-05-09 (Day 1)
    const h1=line.match(/^#\s+(.+)/);
    if(h1){
      flushBuffer();
      const t=h1[1].trim();
      const dm=t.match(/(\d{4}-\d{2}-\d{2})/);
      if(dm) result.date=dm[1];
      const dn=t.match(/Day\s*(\d+)/i);
      if(dn) result.day='Day '+dn[1];
      continue;
    }
    // blockquote (title)
    const bq=line.match(/^>\s+(.+)/);
    if(bq && !mode){flushBuffer();result.title=bq[1].trim();continue;}
    // h2 — section switch
    const h2=line.match(/^##\s+(.+)/);
    if(h2){
      flushBuffer();
      currentItem=null;currentBlock=null;currentQuiz=null;
      const sec=h2[1].trim();
      if(sec==='DECISION_POINTS')mode='DECISION_POINTS';
      else if(/^SPECIALTY[_ ]/.test(sec)){mode='SPECIALTY';currentSp=sec.replace(/^SPECIALTY[_ ]/,'').trim();if(!result.specialties[currentSp]){result.specialties[currentSp]=[];result.specialtyOrder.push(currentSp);}}
      else if(sec==='CASE'){mode='CASE';result.case_={headline:'',body:''};}
      else if(sec==='SELF_CHECK')mode='SELF_CHECK';
      else if(sec==='RECALL_CARD')mode='RECALL_CARD';
      else if(sec==='AUTHOR')mode='AUTHOR';
      else mode=null;
      continue;
    }
    // h3
    const h3=line.match(/^###\s+(.+)/);
    if(h3){
      flushBuffer();
      const text=h3[1].trim();
      if(mode==='SPECIALTY' && currentSp){
        const m=text.match(/^(paper|guideline|insurance|drug|interaction|safety)\s*[:：]\s*(.+)/i);
        currentItem={
          cat: m?m[1].toLowerCase():'paper',
          headline: m?m[2].trim():text,
          summary:'', source:'',
          whyItMatters:'', abstract:'', keyResult:'',
          algorithm:'', compare:'', context:'', cautions:'',
        };
        result.specialties[currentSp].push(currentItem);
        currentBlock=null;
      } else if(mode==='CASE' && result.case_){
        result.case_.headline=text;
      } else if(mode==='SELF_CHECK'){
        currentQuiz={q:text,prompt:'',answer:''};
        result.selfCheck.push(currentQuiz);
        currentBlock='q';
      }
      continue;
    }
    // h4 — block header
    const h4=line.match(/^####\s+(.+)/);
    if(h4){
      flushBuffer();
      const s=h4[1].toLowerCase().trim();
      if(currentItem){
        if(s.includes('어떤')||s.includes('연구')||s.startsWith('why')) currentBlock='whyItMatters';
        else if(s.includes('초록')||s.startsWith('abstract')) currentBlock='abstract';
        else if(s.includes('주요')||s.includes('결과')||s.includes('그림')||s.includes('표')||s.startsWith('key')||s.startsWith('figure')||s.startsWith('table')) currentBlock='keyResult';
        else if(s.includes('알고리즘')||s.includes('적용')) currentBlock='algorithm';
        else if(s.includes('국내')||s.includes('해외')||s.includes('비교')) currentBlock='compare';
        else if(s.includes('금기')||s.includes('주의')||s.includes('caution')) currentBlock='cautions';
        else if(s.startsWith('source')||s.includes('출처')) currentBlock='source';
        else currentBlock='context';
      } else if(currentQuiz){
        if(s.includes('답')||s.startsWith('answer')||s.includes('해설')) currentBlock='answer';
        else currentBlock='q';
      }
      continue;
    }
    // Fallback block headers inside an item (generator sometimes emits these instead of h4):
    //   **어떤 연구** 본문...   |   어떤 연구: 본문...
    if(currentItem){
      let lbl=null, rest='';
      const mb=line.match(/^\*\*([^*]{1,30})\*\*[::]?\s*(.*)$/);
      const mp=mb?null:line.match(/^([가-힣A-Za-z0-9 ·⋅×/()\-]{1,18})[::]\s+(.*)$/);
      if(mb){lbl=mb[1];rest=mb[2];} else if(mp){lbl=mp[1];rest=mp[2];}
      if(lbl){
        const s=lbl.toLowerCase().replace(/[::]\s*$/,'').trim();
        const KNOWN=/어떤|연구|무엇|초록|주요|결과|그림|알고리즘|적용|국내|해외|비교|금기|주의|출처|변경|위험|기전|대체|적응증|함의|용량|근거|영향|의미|시행|^why|^abstract|^key|^source/;
        if(KNOWN.test(s) && !/^[a-e]\)$|답|해설/.test(s)){
          flushBuffer();
          if(s.includes('어떤')||s.includes('연구')||s.includes('무엇')||s.startsWith('why')) currentBlock='whyItMatters';
          else if(s.includes('초록')||s.startsWith('abstract')) currentBlock='abstract';
          else if(s.includes('주요')||s.includes('결과')||s.includes('그림')||s.startsWith('key')) currentBlock='keyResult';
          else if(s.includes('알고리즘')||s.includes('적용')) currentBlock='algorithm';
          else if(s.includes('국내')||s.includes('해외')||s.includes('비교')) currentBlock='compare';
          else if(s.includes('금기')||s.includes('주의')) currentBlock='cautions';
          else if(s.includes('출처')||s.startsWith('source')) currentBlock='source';
          else currentBlock='context';
          if(rest.trim()) buffer.push(rest.trim());
          continue;
        }
      }
    }
    if(line.trim()==='---') continue;
    // DECISION_POINTS list items
    if(mode==='DECISION_POINTS'){
      const dp=line.match(/^\s*[-*]\s+(.+)/);
      if(dp) result.decisionPoints.push(dp[1].trim());
      continue;
    }
    // RECALL_CARD list items
    if(mode==='RECALL_CARD'){
      const rc=line.match(/^\s*[-*]\s+(.+)/);
      if(rc) result.recallCard.push(rc[1].trim());
      continue;
    }
    buffer.push(line);
  }
  flushBuffer();
  return result;
}

/* ---------- tag chip helper ---------- */
function tagChip(text){
  // detect [즉시] / [변경] / [참고] / [재등장] at beginning
  const m=text.match(/^\s*\[(즉시|변경|참고|재등장)\]\s*(.*)/);
  if(!m) return {tag:'',rest:text};
  const map={'즉시':['now','즉시'],'변경':['change','변경'],'참고':['ref','참고'],'재등장':['recur','재등장']};
  const [cls,abbr]=map[m[1]]||['ref','REF'];
  return {tag:'<span class="tag '+cls+'">'+abbr+'</span>', rest:m[2]};
}

/* ---------- render: clinical content stays source-authored ---------- */
const CAT_CLASS={paper:'paper',guideline:'guide',insurance:'ins',drug:'drug',interaction:'int',safety:'safe'};
const CAT_ABBR={paper:'논문',guideline:'가이드라인',insurance:'급여',drug:'신약',interaction:'상호작용',safety:'안전성'};
const CAT_SYMBOL={paper:'▤',guideline:'≡',insurance:'₩',drug:'+',interaction:'⇄',safety:'!'};
function categoryBadge(cat){return '<span class="item-cat '+(CAT_CLASS[cat]||'paper')+'"><span class="cat-symbol" aria-hidden="true">'+(CAT_SYMBOL[cat]||'▤')+'</span>'+esc(CAT_ABBR[cat]||cat)+'</span>';}
function isNoUpdate(it){return /^\(?이번 회차 신규 사항 없음\)?[.。]?$/.test(it.headline.trim())&&!['summary','source','whyItMatters','abstract','keyResult','algorithm','compare','context','cautions'].some(k=>it[k]?.trim());}
function itemPreview(it){
  let inVisual=false;
  return (it.summary||it.keyResult||it.whyItMatters||it.algorithm||'').split('\n').find(l=>{
    const line=l.trim();
    if(inVisual){if(line==='```')inVisual=false;return false;}
    if(line==='```visual'){inVisual=true;return false;}
    return line&&!/^```|^\||^>/.test(line);
  })||'';
}
function renderItemBlocks(it){return [['summary','요약',''],['whyItMatters','어떤 연구',''],['abstract','초록',''],['keyResult','주요 결과',''],['algorithm','적용 알고리즘','algo'],['compare','국내 vs 해외','compare'],['context','상세 내용',''],['cautions','금기 · 주의','cautions'],['source','출처','source']].filter(([key])=>it[key]).map(([key,title,cls])=>'<div class="block '+cls+'"><h4>'+title+'</h4>'+mdBlock(it[key])+'</div>').join('');}
function renderArticle(it,spKey,ii){
  const id='item-'+encodeURIComponent(spKey)+'-'+ii,preview=itemPreview(it),tagged=tagChip(it.headline),headline=tagged.rest,body=renderItemBlocks(it);
  return '<details class="item" id="'+id+'" data-item-key="'+esc(spKey)+'-'+ii+'"><summary class="item-head">'+categoryBadge(it.cat)+'<div class="item-copy"><h3 class="item-headline">'+tagged.tag+esc(headline)+'</h3>'+(preview?'<div class="item-summary">'+esc(preview.replace(/\*\*|`/g,''))+'</div>':'')+'</div><span class="item-toggle" aria-hidden="true">+</span></summary><div class="blocks">'+(body||'<p class="block">이 항목은 원문에 헤드라인만 제공되어 있습니다.</p>')+'</div></details>';
}
function renderQuizPrompt(q,i){
  const lines=(q.prompt||'').split('\n'),choices=[],other=[];
  for(const line of lines){if(/^\s*(?:[a-eA-E][).]|[①-⑤])\s*/.test(line))choices.push(line.trim());else other.push(line);}
  return (other.join('').trim()?'<div class="quiz-prompt">'+mdBlock(other.join('\n'))+'</div>':'')+(choices.length?'<fieldset class="quiz-options"><legend class="sr-only">'+esc(q.q)+' 선택지</legend>'+choices.map((choice,n)=>'<label class="quiz-option"><input type="radio" name="quiz-'+i+'" value="'+n+'"><span>'+mdInline(choice)+'</span></label>').join('')+'</fieldset>':'');
}
function render(data){
  document.getElementById('h-eyebrow').textContent='DAILY BRIEFING'+(data.day?' / '+data.day.toUpperCase():'');
  document.getElementById('h-meta').innerHTML='<b id="h-date">'+esc(formatDate(data.date))+'</b>'+(data.day?'<span class="pill">'+esc(data.day)+'</span>':'')+'<span>'+data.specialtyOrder.length+'개 과목</span>';
  document.getElementById('archive-label').textContent=(data.date?data.date.replace(/-/g,'.')+' · ':'')+'지난 브리핑';
  const active=[];data.specialtyOrder.forEach(spKey=>(data.specialties[spKey]||[]).forEach((it,i)=>{if(!isNoUpdate(it))active.push({it,spKey,i});}));
  let html='<section class="overview" id="overview" aria-labelledby="overview-title"><div class="section-heading"><div><span class="section-kicker">TODAY’S READING</span><h2 id="overview-title">이번 회차 한눈에</h2></div><p>읽을 항목 '+active.length+' · 셀프 체크 '+data.selfCheck.length+'</p></div>';
  if(active.length){html+='<div class="overview-grid">'+active.slice(0,3).map(({it,spKey,i},n)=>'<a class="overview-card" href="#item-'+encodeURIComponent(spKey)+'-'+i+'" data-open-item="item-'+encodeURIComponent(spKey)+'-'+i+'"><div class="overview-top"><span>'+esc((SPECIALTIES[spKey]||{}).sub||spKey)+'</span><span>'+String(n+1).padStart(2,'0')+'</span></div><strong>'+esc(it.headline.replace(/^\[(즉시|변경|참고|재등장)\]\s*/,''))+'</strong><div class="overview-bottom"><span>'+esc(CAT_ABBR[it.cat]||it.cat)+' 읽기</span><span aria-hidden="true">↗</span></div></a>').join('')+'</div>';}
  else html+='<div class="overview-empty">이번 회차에 새로 추가된 항목이 없습니다. 아래에서 과목별 기록과 복습 자료를 확인할 수 있어요.</div>';
  html+='</section><nav class="specialty-nav" aria-label="과목 및 복습 바로가기">'+data.specialtyOrder.map(spKey=>{const items=data.specialties[spKey]||[],n=items.filter(it=>!isNoUpdate(it)).length;return '<a href="#specialty-'+esc(spKey)+'">'+esc((SPECIALTIES[spKey]||{}).sub||spKey)+'<span class="nav-count">'+n+'</span></a>';}).join('')+(data.selfCheck.length?'<a href="#self-check">셀프 체크</a>':'')+(data.recallCard.length?'<a href="#recall-card">한 장 복습</a>':'')+'</nav>';
  if(data.decisionPoints.length)html+='<section class="case-section"><span class="section-kicker">DECISION POINTS</span><h2>이번 회차 핵심 포인트</h2><div class="block">'+mdBlock(data.decisionPoints.map(p=>'- '+p).join('\n'))+'</div></section>';
  data.specialtyOrder.forEach((spKey,idx)=>{
    const meta=SPECIALTIES[spKey]||{title:spKey,sub:spKey},items=data.specialties[spKey]||[],populated=items.map((it,i)=>({it,i})).filter(({it})=>!isNoUpdate(it)),empty=items.filter(isNoUpdate);
    html+='<section class="specialty-section" id="specialty-'+esc(spKey)+'" aria-labelledby="title-'+esc(spKey)+'"><div class="sp-head"><span class="sp-num">'+String(idx+1).padStart(2,'0')+'</span><h2 class="sp-title" id="title-'+esc(spKey)+'">'+esc(meta.sub)+'<small>'+esc(meta.title)+'</small></h2><span class="sp-sub">'+populated.length+'개 학습 항목</span></div>';
    if(populated.length)html+='<div class="article-list">'+populated.map(({it,i})=>renderArticle(it,spKey,i)).join('')+'</div>';
    if(empty.length)html+='<details class="no-updates"><summary><span><span aria-hidden="true">✓</span> 신규 사항 없는 항목 '+empty.length+'개</span><span class="empty-caret" aria-hidden="true">⌄</span></summary><ul class="empty-items">'+empty.map(it=>'<li>'+categoryBadge(it.cat)+'<span>'+esc(it.headline)+'</span></li>').join('')+'</ul></details>';
    html+='</section>';
  });
  if(data.case_&&(data.case_.headline||data.case_.body))html+='<section class="case-section"><span class="section-kicker">CASE STUDY</span><h2>케이스로 연결하기</h2><h3>'+esc(data.case_.headline)+'</h3><div class="block">'+mdBlock(data.case_.body)+'</div></section>';
  if(data.selfCheck.length||data.recallCard.length){html+='<div class="learning-grid">';
    if(data.selfCheck.length){html+='<section class="review-section" id="self-check" aria-labelledby="self-check-title"><div class="section-heading"><div><span class="section-kicker">ACTIVE RECALL</span><h2 id="self-check-title">스스로 확인해 보세요</h2></div><p>'+data.selfCheck.length+' QUESTIONS</p></div>';
      data.selfCheck.forEach((q,i)=>{html+='<article class="quiz" data-quiz-idx="'+i+'"><span class="quiz-number">QUESTION '+String(i+1).padStart(2,'0')+'</span><h3 class="quiz-q">'+esc(q.q.replace(/^Q\d+\.\s*/,''))+'</h3>'+renderQuizPrompt(q,i)+(q.answer?'<details class="quiz-answer"><summary class="quiz-toggle">정답 · 해설 확인</summary><div class="quiz-a">'+mdBlock(q.answer)+'</div></details>':'')+'</article>';});html+='</section>';}
    if(data.recallCard.length)html+='<aside class="review-section" id="recall-card"><div class="section-heading"><div><span class="section-kicker">KEEP IN MIND</span><h2>읽은 내용을 내 것으로</h2></div></div><details class="recall" open><summary class="recall-label"><span>한 장 복습</span><small>'+data.recallCard.length+' NOTES · 접기 / 펼치기</small></summary><p class="recall-sub">한 줄씩 떠올려 보고, 기억을 확인하세요.</p><ul>'+data.recallCard.map(l=>'<li>'+mdInline(l)+'</li>').join('')+'</ul></details></aside>';
    html+='</div>';
  }
  const content=document.getElementById('content');content.innerHTML=html;content.setAttribute('aria-busy','false');
  document.getElementById('footer').textContent=[data.title,data.author].filter(Boolean).join(' · ');
  document.querySelectorAll('[data-open-item]').forEach(link=>link.addEventListener('click',()=>{const item=document.getElementById(link.dataset.openItem);if(item)item.open=true;}));
  if(location.hash.startsWith('#item-')){const item=document.getElementById(location.hash.slice(1));if(item){item.open=true;requestAnimationFrame(()=>item.scrollIntoView());}}
}

/* Calendar and loading — same-origin first, GitHub fallback */
const SUFFIXES=['.md','-day1.md','-day2.md','-day3.md'];
const CAL={viewYear:0,viewMonth:0,available:new Set(),files:{},selectedDate:null};
let loadSequence=0;
async function request(url,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{return await fetch(url,{...options,signal:controller.signal});}finally{clearTimeout(timer);}}
async function loadDates(){
  const cacheKey='briefings-list-study';let cached=null;
  try{cached=JSON.parse(localStorage.getItem(cacheKey));if(cached&&Array.isArray(cached.dates)){CAL.available=new Set(cached.dates);CAL.files=cached.files||{};if(Date.now()-cached.ts<120000)return;}}catch(e){}
  try{const r=await request('https://api.github.com/repos/'+REPO+'/contents/'+CAT+'?_='+Date.now(),{cache:'no-store'});if(r.ok){const items=await r.json();if(!Array.isArray(items))return;const dates=new Set(),files={};for(const it of items){const m=it.name&&it.name.match(/^(\d{4}-\d{2}-\d{2})(?:-day[123])?\.md$/);if(m){dates.add(m[1]);files[m[1]]=it.name;}}CAL.available=dates;CAL.files=files;try{localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),dates:[...dates],files}));}catch(e){}}}catch(e){}
}
function renderCal(){
  const y=CAL.viewYear,m=CAL.viewMonth,fd=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(),today=kstDateStr(0),grid=document.getElementById('cal-grid');if(!grid)return;
  let html=['일','월','화','수','목','금','토'].map(w=>'<div class="cal-wd">'+w+'</div>').join('');for(let i=0;i<fd;i++)html+='<div class="cal-empty" aria-hidden="true"></div>';let marked=0;
  for(let d=1;d<=dim;d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),has=CAL.available.has(ds);if(has)marked++;const selected=ds===CAL.selectedDate,cls='cal-day'+(has?' has':'')+(ds===today?' today':'')+(selected?' is-selected':'');html+='<button type="button" class="'+cls+'" data-date="'+ds+'" aria-label="'+ds+(has?' 브리핑':' 브리핑 없음')+'"'+(selected?' aria-pressed="true"':' aria-pressed="false"')+(ds===today?' aria-current="date"':'')+(!has?' disabled':'')+'>'+d+'</button>';}
  grid.innerHTML=html;document.getElementById('cal-title').textContent=y+'년 '+(m+1)+'월';document.getElementById('cal-count').textContent=marked+'개 브리핑';grid.querySelectorAll('.cal-day.has').forEach(el=>el.addEventListener('click',()=>{document.getElementById('archive').open=false;loadAndRender(el.dataset.date,{history:true});}));
}
function validDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return false;const d=new Date(value+'T00:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===value;}
function expectedFilename(ds){const diff=Math.round((Date.parse(ds+'T00:00:00Z')-Date.parse('2026-05-09T00:00:00Z'))/86400000);return ds+'-day'+(((diff%3)+3)%3+1)+'.md';}
async function fetchMd(ds){const names=[...new Set([CAL.files[ds],expectedFilename(ds),...SUFFIXES.map(sfx=>ds+sfx)].filter(Boolean))];for(const name of names){const paths=[CAT+'/'+name,'https://raw.githubusercontent.com/'+REPO+'/main/'+CAT+'/'+name];for(const path of paths){try{const r=await request(path,{cache:'no-cache'});if(r.ok){const text=await r.text();if(!/^\s*(?:<!doctype\s+html|<html)/i.test(text)&&/^#\s+.*\d{4}-\d{2}-\d{2}/m.test(text))return text;}}catch(e){}}}return null;}
async function fetchLatest(){const sorted=[...CAL.available].sort().reverse();for(const ds of sorted.slice(0,3)){const md=await fetchMd(ds);if(md)return {date:ds,md};}if(sorted.length)return null;for(let i=0;i<14;i++){const ds=kstDateStr(i);if(CAL.available.has(ds))continue;const md=await fetchMd(ds);if(md)return {date:ds,md};}return null;}
function showLoadError(dateStr){const el=document.getElementById('content');el.setAttribute('aria-busy','false');el.innerHTML='<div class="state" role="status"><div class="state-mark">↻</div>'+(dateStr?esc(dateStr)+' 브리핑을 불러오지 못했어요.':'브리핑을 불러오지 못했어요.')+'<br>연결 상태를 확인하거나 다른 날짜를 선택해 주세요.<br><button id="retry-load" type="button">다시 불러오기</button></div>';document.getElementById('retry-load').addEventListener('click',()=>loadAndRender(dateStr));}
async function loadAndRender(dateStr,options={}){
  const seq=++loadSequence,el=document.getElementById('content');el.setAttribute('aria-busy','true');el.innerHTML='<div class="state" role="status"><div class="state-mark">···</div>브리핑을 불러오고 있어요…</div>';
  try{let result;if(dateStr){const md=await fetchMd(dateStr);if(md)result={date:dateStr,md};}else result=await fetchLatest();if(seq!==loadSequence)return;if(!result){showLoadError(dateStr);return;}CAL.selectedDate=result.date;CAL.available.add(result.date);const [year,month]=result.date.split('-').map(Number);CAL.viewYear=year;CAL.viewMonth=month-1;renderCal();render(parseMarkdown(result.md));if(options.history){const url=new URL(location.href);url.searchParams.set('date',result.date);url.hash='';history.pushState({},'',url);}}catch(e){if(seq===loadSequence)showLoadError(dateStr);}
}
function syncNetworkStatus(){document.getElementById('status-text').textContent=navigator.onLine?'매일 18:00 KST':'오프라인 · 저장된 브리핑';}
async function init(){
  const t=kstNow();CAL.viewYear=t.getUTCFullYear();CAL.viewMonth=t.getUTCMonth();syncNetworkStatus();window.addEventListener('online',syncNetworkStatus);window.addEventListener('offline',syncNetworkStatus);
  document.getElementById('cal-prev').addEventListener('click',()=>{CAL.viewMonth--;if(CAL.viewMonth<0){CAL.viewMonth=11;CAL.viewYear--;}renderCal();});document.getElementById('cal-next').addEventListener('click',()=>{CAL.viewMonth++;if(CAL.viewMonth>11){CAL.viewMonth=0;CAL.viewYear++;}renderCal();});
  window.addEventListener('popstate',()=>{const date=new URLSearchParams(location.search).get('date');loadAndRender(validDate(date)?date:null);});const date=new URLSearchParams(location.search).get('date');await loadDates();renderCal();await loadAndRender(validDate(date)?date:null);
}
init();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{scope:'./',updateViaCache:'none'}).catch(()=>{});});}

</script>
